<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
<title>우동폰 통합서비스</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     우동폰 메인 헤더
========================= -->
<header class="hero">
    <div class="hero-content">
        <div class="logo">
            <img src="logo.png" alt="우동폰 로고">
            <div class="logo-text">
                우 동 폰
                <span>우리 동네 할인 / 쿠폰 플랫폼</span>
            </div>
        </div>
        <p class="description">
            우리 동네 매장과 다양한 정보를<br>
            한눈에 만나보세요.
        </p>
    </div>
</header>
<!-- =========================
     지역 선택
========================= -->
<main class="container">
    <h2 class="section-title">
        지역을 선택하세요
    </h2>

    <!-- 도 선택 -->
    <div class="province-select">
        <select id="provinceSelect" aria-label="도·광역시 선택">
            <option value="">도·광역시를 선택하세요</option>

            <option value="seoul">서울특별시</option>
            <option value="busan">부산광역시</option>
            <option value="daegu">대구광역시</option>
            <option value="incheon">인천광역시</option>
            <option value="gwangju">광주광역시</option>
            <option value="daejeon">대전광역시</option>
            <option value="ulsan">울산광역시</option>
            <option value="sejong">세종특별자치시</option>

            <option value="gyeonggi">경기도</option>
            <option value="gangwon">강원특별자치도</option>
            <option value="chungbuk">충청북도</option>
            <option value="chungnam">충청남도</option>
            <option value="jeonbuk">전북특별자치도</option>
            <option value="jeonnam">전라남도</option>
            <option value="gyeongbuk">경상북도</option>
            <option value="gyeongnam">경상남도</option>
            <option value="jeju">제주특별자치도</option>
            
        </select>               
    </div>

    <div class="region-list"></div>

</main>

</main>
<footer>
    © 2026 고니의 우동폰. 우리 동네 할인/쿠폰의 모든 것.
</footer>

<script src="regions.js"></script>
<script src="script.js"></script>

</body>
</html>
